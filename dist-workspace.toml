[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Whether to install an updater program
install-updater = false
pr-run-mode = "plan"
checksum = "sha256"
github-attestations = true
include = ["NOTICE", "COVERAGE.md", "THIRD-PARTY-LICENSES.html", "packaging/rstop.1", "packaging/completions"]
plan-jobs = ["./checks"]
host-jobs = ["./install-checks"]
github-release = "announce"
post-announce-jobs = ["./install-public"]
# distribution.py adds the native-installation gate omitted by cargo-dist 0.33.1.
allow-dirty = ["ci"]
github-build-setup = "../dist-setup.yml"
source-tarball = false

[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
x86_64-apple-darwin = "macos-15-intel"
aarch64-apple-darwin = "macos-15"
x86_64-pc-windows-msvc = "windows-2022"
aarch64-pc-windows-msvc = "windows-11-arm"

[dist.github-action-commits]
"actions/checkout" = "11d5960a326750d5838078e36cf38b85af677262"
"actions/upload-artifact" = "ea165f8d65b6e75b540449e92b4886f43607fa02"
"actions/download-artifact" = "d3f86a106a0bac45b974a628896c90dbdf5c8093"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
