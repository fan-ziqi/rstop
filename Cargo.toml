[package]
name = "rstop"
version = "0.1.4"
edition = "2024"
rust-version = "1.95"
description = "A unified, GPU-aware local resource monitor for Linux, macOS and Windows"
authors = ["Ziqi Fan"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/fan-ziqi/rstop"
homepage = "https://fan-ziqi.github.io/rstop/"
keywords = ["cli", "monitor", "gpu", "process", "terminal"]
categories = ["command-line-utilities", "visualization"]
include = ["/src/**", "/tests/*.rs", "/vendor/crossterm/**", "/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml", "/LICENSE", "/NOTICE", "/README.md", "/CHANGELOG.md", "/COVERAGE.md"]

[patch.crates-io]
crossterm = { path = "vendor/crossterm" }

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
axoupdater = { version = "0.10.3", default-features = false, features = ["github_releases", "blocking"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
crossterm = { version = "0.29", features = ["osc52"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
nvml-wrapper = { version = "0.13", features = ["legacy-functions"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starship-battery = "0.12"
sysinfo = "0.39.6"
toml = "0.9"
regex = "1"
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }

[dev-dependencies]
socket2 = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_Security"] }
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
