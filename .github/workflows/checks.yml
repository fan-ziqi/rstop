name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Main/PR checks cover all platforms; tags need only the Linux gate
        # before the release workflow compiles all six platform archives.
        os: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '["ubuntu-22.04"]' || '["ubuntu-22.04","macos-15","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --locked --all-targets -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo test --locked
      - name: Public CLI, terminal and generated documentation
        shell: bash
        run: |
          binary=target/debug/rstop
          if [[ "$RUNNER_OS" == Windows ]]; then binary+=.exe; fi
          python scripts/distribution.py docs --binary "$binary" --check
          python scripts/distribution.py smoke --binary "$binary"
          python scripts/terminal_smoke.py "$binary" --read-only --no-gpu --interval 250 --config "$RUNNER_TEMP/rstop-terminal.toml"
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/distribution.py workflow --check
      - name: Install license collector
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-about@0.9.2
      - name: Collect dependency licenses once
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        run: cargo about generate --locked --fail packaging/licenses.hbs -o THIRD-PARTY-LICENSES.html
      - name: Share dependency licenses with release builds
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-licenses
          path: THIRD-PARTY-LICENSES.html
          if-no-files-found: error
